<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SortSmart Business Advisor</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --amber:#d29922; --red:#f85149; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; min-height:100vh; }
  header { padding:20px 28px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  header .logo { font-size:24px; }
  header h1 { font-size:18px; font-weight:600; }
  header h1 span { color:var(--dim); font-weight:400; }
  header .amd { margin-left:auto; font-size:12px; color:var(--dim); border:1px solid var(--border); padding:4px 10px; border-radius:20px; }
  main { max-width:900px; margin:0 auto; padding:28px 20px 60px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:16px; }
  .card h2 { font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:14px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  label { font-size:12px; color:var(--dim); display:block; margin-bottom:4px; }
  select, input[type=text], input[type=number] { background:var(--bg); border:1px solid var(--border); color:var(--text);
      border-radius:6px; padding:9px 12px; font-size:14px; width:100%; }
  select:focus, input:focus, textarea:focus { outline:none; border-color:var(--accent); }
  textarea { background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px;
      padding:12px; font-size:15px; width:100%; min-height:84px; resize:vertical; font-family:inherit; }
  .field { flex:1; min-width:160px; }
  button.ask { background:#1f6feb; color:#fff; border:none; border-radius:6px; padding:12px 28px;
      font-size:15px; font-weight:600; cursor:pointer; width:100%; margin-top:4px; }
  button.ask:hover { background:#388bfd; }
  button.ask:disabled { opacity:.5; cursor:wait; }
  .score-wrap { display:flex; align-items:center; gap:18px; }
  .score-ring { width:92px; height:92px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-size:28px; font-weight:700; flex-shrink:0; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:14px; }
  .stat { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px; }
  .stat .v { font-size:20px; font-weight:700; }
  .stat .k { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
  .answer { white-space:pre-wrap; line-height:1.65; font-size:14.5px; }
  .answer strong { color:var(--accent); }
  .rec { border-left:3px solid var(--green); padding:10px 14px; margin:10px 0; background:var(--bg); border-radius:0 8px 8px 0; }
  .rec .money { color:var(--green); font-weight:700; }
  .rec.cost .money { color:var(--amber); }
  .hidden { display:none; }
  .err { color:var(--red); padding:12px; }
  .examples { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .examples button { background:var(--bg); border:1px solid var(--border); color:var(--dim); border-radius:20px;
      padding:6px 14px; font-size:12.5px; cursor:pointer; }
  .examples button:hover { color:var(--text); border-color:var(--accent); }
  .spin { display:inline-block; width:16px; height:16px; border:2px solid #fff3; border-top-color:#fff;
      border-radius:50%; animation:s 0.7s linear infinite; vertical-align:-3px; margin-right:8px; }
  @keyframes s { to { transform:rotate(360deg); } }
  footer { text-align:center; color:var(--dim); font-size:12px; padding:24px; }
</style>
</head>
<body>
<header>
  <div class="logo">♻️</div>
  <h1>SortSmart <span>// Business Advisor</span></h1>
  <div class="amd">AMD ACT III · Reinvent Commerce</div>
</header>
<main>
  <div class="card">
    <h2>Your business</h2>
    <div class="row">
      <div class="field"><label>Business type</label>
        <select id="btype">
          <option value="retail">Retail store</option>
          <option value="restaurant">Restaurant</option>
          <option value="office">Office</option>
          <option value="warehouse">Warehouse / fulfillment</option>
          <option value="ecommerce" selected>E-commerce shipper</option>
        </select>
      </div>
      <div class="field"><label>Shipments / month</label>
        <input type="number" id="shipments" value="2000" min="0">
      </div>
      <div class="field"><label>Current packaging</label>
        <select id="packaging">
          <option value="poly_mailer" selected>Plastic poly mailer</option>
          <option value="corrugated_mailer">Corrugated mailer</option>
          <option value="padded_paper_mailer">Padded paper mailer</option>
          <option value="compostable_mailer">Compostable mailer</option>
          <option value="reused_box">Reused box</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Ask the advisor</h2>
    <textarea id="q" placeholder="e.g. We ship 2,000 packages a month in plastic mailers — what should we switch to and what will it cost?"></textarea>
    <div class="examples">
      <button data-q="We ship 2,000 packages a month in plastic mailers. What should we switch to?">📦 Packaging switch</button>
      <button data-q="We're a restaurant wasting 1,500 lbs of food a month. How much can composting save us?">🍎 Restaurant composting</button>
      <button data-q="What's our sustainability score and how do we raise it?">📊 Sustainability score</button>
    </div>
    <button class="ask" id="askBtn" style="margin-top:12px">Get advice</button>
  </div>

  <div class="card hidden" id="scoreCard">
    <h2>Snapshot</h2>
    <div class="score-wrap">
      <div class="score-ring" id="ring">–</div>
      <div>
        <div style="font-size:15px;font-weight:600" id="gradeLine">–</div>
        <div style="font-size:13px;color:var(--dim)" id="bizLine">–</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="v" id="stCost">–</div><div class="k">Est. monthly disposal</div></div>
      <div class="stat"><div class="v" id="stTop">–</div><div class="k">Top lever</div></div>
    </div>
  </div>

  <div class="card hidden" id="answerCard">
    <h2>Advisor answer</h2>
    <div class="answer" id="answer"></div>
  </div>
</main>
<footer>Estimates use US national averages — validate against local hauler rates. · SortSmart Business Advisor · MIT</footer>

<script>
const $ = id => document.getElementById(id);
document.querySelectorAll('.examples button').forEach(b =>
  b.onclick = () => { $('q').value = b.dataset.q; });

function ringColor(score) {
  return score >= 70 ? 'var(--green)' : score >= 40 ? 'var(--amber)' : 'var(--red)';
}

$('askBtn').onclick = async () => {
  const q = $('q').value.trim();
  if (!q) return;
  const btn = $('askBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Analyzing…';
  $('scoreCard').classList.add('hidden');
  $('answerCard').classList.add('hidden');
  try {
    const res = await fetch('/api/ask', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        question: q,
        business_type: $('btype').value,
        monthly_shipments: parseInt($('shipments').value) || 0,
        packaging: $('packaging').value,
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    // Score snapshot
    const g = data.grounded;
    const ring = $('ring');
    ring.textContent = g.sustainability_score;
    ring.style.border = `4px solid ${ringColor(g.sustainability_score)}`;
    ring.style.color = ringColor(g.sustainability_score);
    $('gradeLine').textContent = `Grade ${g.sustainability_grade} · ${data.business_type}`;
    $('bizLine').textContent = `Model: ${data.model}`;
    $('stCost').textContent = '$' + g.monthly_disposal_usd.toFixed(0) + '/mo';
    $('stTop').textContent = (g.top_recommendation || '—').slice(0, 42);
    $('scoreCard').classList.remove('hidden');

    // Answer (escape HTML, then bold $ figures)
    let html = data.answer.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    html = html.replace(/(\$[\d,]+(?:\.\d{2})?)/g, '<strong>$1</strong>');
    $('answer').innerHTML = html;
    $('answerCard').classList.remove('hidden');
  } catch (e) {
    $('answer').innerHTML = '<div class="err">Error: ' + e.message + '</div>';
    $('answerCard').classList.remove('hidden');
  }
  btn.disabled = false;
  btn.textContent = 'Get advice';
};
</script>
</body>
</html>
